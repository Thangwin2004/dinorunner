<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <title>Bộ Lạc Phiêu Lưu Ký</title>
</head>

<body>
  <div id="app">



    <!-- HTML Splash Screen -->
    <div id="splash-screen" style="position: absolute; top:0; left:0; width:100%; height:100%; background:#1a1a1a; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; transition: opacity 0.5s;">
      <div id="splash-text" style="color:#ffffff; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:36px; font-weight:bold; margin-bottom:20px;">Loading 0%</div>
      <div style="width:300px; height:20px; background:#333333; border-radius:10px; overflow:hidden;">
        <div id="splash-progress" style="width:0%; height:100%; background:#F9A825; transition: width 0.1s;"></div>
      </div>
    </div>

    <!-- HTML Gameplay HUD Overlay -->
    <div id="game-hud-overlay" style="display: none;">
      <div class="hud-left-container">
        <div id="hud-score" class="hud-clean-text-line score-clean">
          <span class="hud-badge-icon">🎯</span>
          <span class="hud-badge-label">ĐIỂM:</span>
          <span id="hud-score-val" class="hud-badge-val">0</span>
        </div>
        <div id="hud-highscore" class="hud-clean-text-line highscore-clean">
          <span class="hud-badge-icon">🏆</span>
          <span class="hud-badge-label">KỶ LỤC:</span>
          <span id="hud-highscore-val" class="hud-badge-val">0</span>
        </div>
      </div>
      <button id="hud-pause-btn" aria-label="Tạm dừng">
        <div class="hud-pause-icon"></div>
      </button>
    </div>

    <!-- HTML Main Menu Overlay (Stitch Main Menu Variant 2) -->
    <div id="game-menu-overlay" style="display: none;">
      <!-- Top Mascot Tribal Emblem Ring Header (Stitch Design + Original Tribal Avatar) -->
      <div id="menu-emblem-container" style="position: relative; width: 210px; height: 200px; margin-top: 15px;">
        <svg width="210" height="200" viewBox="0 0 210 200" fill="none">
          <defs>
            <linearGradient id="emblemBgGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4DD0E1"/>
              <stop offset="100%" stop-color="#00ACC1"/>
            </linearGradient>
            <linearGradient id="woodRingGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#B86D2A"/>
              <stop offset="40%" stop-color="#8B4513"/>
              <stop offset="100%" stop-color="#4A2006"/>
            </linearGradient>
            <linearGradient id="goldBevelGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFE082"/>
              <stop offset="100%" stop-color="#FF8F00"/>
            </linearGradient>
          </defs>
          <!-- Feather Decor Left -->
          <g transform="translate(8, 80)">
            <path d="M28 20 C10 0 0 35 20 55 C28 35 30 25 28 20 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="2"/>
            <path d="M22 55 C12 40 10 70 30 75 C26 60 24 58 22 55 Z" fill="#8D6E63" stroke="#37474F" stroke-width="2"/>
          </g>
          <!-- Feather Decor Right -->
          <g transform="translate(148, 80)">
            <path d="M22 20 C40 0 50 35 30 55 C22 35 20 25 22 20 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="2"/>
            <path d="M28 55 C38 40 40 70 20 75 C24 60 26 58 28 55 Z" fill="#8D6E63" stroke="#37474F" stroke-width="2"/>
          </g>
          <!-- Outer Tribal Wood Ring -->
          <circle cx="105" cy="95" r="82" fill="url(#woodRingGrad)" stroke="#3E1C04" stroke-width="6"/>
          <!-- Inner Smooth Gold Bevel Ring -->
          <circle cx="105" cy="95" r="73" fill="none" stroke="url(#goldBevelGrad)" stroke-width="5"/>
          <circle cx="105" cy="95" r="70" fill="none" stroke="#5D2405" stroke-width="1.8"/>
          <!-- Inner Cyan Portal Background -->
          <circle cx="105" cy="95" r="64" fill="url(#emblemBgGrad)" stroke="#3E1C04" stroke-width="4"/>
        </svg>

        <!-- CC0 biped dog runner avatar (full body) -->
        <img id="menu-avatar-img" src="/assest/image/player_pet/run/run-01.png" alt="Chú chó phiêu lưu" 
             style="position: absolute; top: 44px; left: 50%; transform: translateX(-50%); width: 98px; height: 98px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); pointer-events: none;" />
      </div>

      <!-- Carved Wood Title Signboard -->
      <div id="menu-title-wood-sign">
        <div class="title-wood-board">
          <div class="title-line-1">BỘ LẠC</div>
          <div class="title-line-2">PHIÊU LƯU KÝ</div>
        </div>
      </div>

      <!-- Highscore Clean Line -->
      <div id="menu-highscore" class="menu-highscore-clean">
        <span class="menu-highscore-icon">🏆</span>
        <span id="menu-highscore-text">KỶ LỤC ĐIỂM: 0</span>
      </div>

      <!-- Glowing Green Energy Aura Play Button -->
      <div class="menu-play-btn-wrapper">
        <div class="play-glow-ring play-ring-1"></div>
        <div class="play-glow-ring play-ring-2"></div>
        <button id="menu-play-btn">CHƠI NGAY</button>
      </div>
      <div id="menu-bottom-buttons">
        <button class="menu-bottom-btn menu-btn-cyan" id="menu-btn-achievements" aria-label="Bảng Vàng">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#FFFFFF" style="filter: drop-shadow(0 2px 0 #01579B);"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V18H8v2h8v-2h-3v-2.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
        </button>
        <button class="menu-bottom-btn menu-btn-purple" id="menu-btn-instructions" aria-label="Hướng Dẫn">
          <span style="font-family: 'Be Vietnam Pro', sans-serif; font-size: 32px; font-weight: 900; color: #FFFFFF; text-shadow: 0 2.5px 0 #4A148C; line-height: 1;">?</span>
        </button>
        <button class="menu-bottom-btn menu-btn-blue" id="menu-btn-settings" aria-label="Cài Đặt">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#FFFFFF" style="filter: drop-shadow(0 2px 0 #0D47A1);"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
        </button>
      </div>
    </div>

    <!-- Pixi Container -->
    <div id="pixi-container"></div>
  </div>
  <script src="/wink-bridge.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
